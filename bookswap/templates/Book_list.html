<!DOCTYPE html>
{% load static %}
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>

        <h1>📚 Explore Books</h1>
        <label for="genreFilter">Filter genre:</label>
        <select id="genreFilter" onchange='filterchange()'>
            <option value="">All</option>
            {% for genrekey, genrename in Genre_Options %}
            <option value="{{genrekey}}">{{genrename}}</option>
            {% endfor %}
        </select>



        <input type="text" id="searchBox" placeholder="Search for a book..." onkeyup="searchbook()">

        <ul id="booklist" style="list-style-type:none;">
            {% for book in books%}
                <li data-genre="{{book.genre }}">
                    <a href="{% url "book-detail-page" book.book_id %}">{{book.book_name}}</a>
                </li>
            {% empty %}
            <li>No Books found</li>
            {% endfor %}
        </ul>



        
    </body>
    <script src="{% static 'script.js' %}"></script>
</html>
